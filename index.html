<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本再構築テスト</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Shippori+Mincho:wght@700;800&display=swap');
:root{--paper:#EEF2F5;--sea-0:#DCE9F0;--sea-1:#B9D4E2;--ink:#16283B;--ink-soft:#5A7183;
--land:#F0DFA8;--land-br:#C9A85C;--stamp:#D8382B;--good:#2E9E6B;--line:rgba(22,40,59,.12);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;
-webkit-user-select:none;user-select:none;touch-action:manipulation;}
.wrap{max-width:600px;margin:0 auto;padding:14px 14px 40px;}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
h1{font-weight:900;font-size:clamp(21px,5.6vw,28px);margin:0;letter-spacing:.02em;}
.sub{font-size:12px;color:var(--ink-soft);font-weight:500;}
.hud{display:flex;align-items:center;gap:12px;font-weight:700;}
.timer{font-variant-numeric:tabular-nums;font-size:20px;}
.timer.low{color:var(--stamp);}
.left-count{font-size:13px;color:var(--ink-soft);font-weight:700;}
.field-shell{position:relative;width:100%;aspect-ratio:1/1;}
.field{position:relative;width:100%;height:100%;
background:radial-gradient(120% 120% at 62% 24%,var(--sea-0),var(--sea-1));
border:2px solid var(--ink);border-radius:16px;overflow:hidden;
box-shadow:inset 0 2px 18px rgba(22,40,59,.14);}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.guide{fill:#EAF0F3;stroke:var(--ink-soft);stroke-width:1.4;stroke-dasharray:4 3;
stroke-linejoin:round;opacity:.85;}
.rev-correct{fill:rgba(46,158,107,.55);stroke:#1E7A50;stroke-width:1.2;stroke-linejoin:round;}
.rev-wrong{fill:rgba(216,56,43,.5);stroke:#9E241B;stroke-width:1.2;stroke-linejoin:round;}
.cap{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-weight:900;font-size:12px;
color:var(--ink);background:rgba(255,255,255,.82);padding:3px 11px;border-radius:9px;display:none;
z-index:6;box-shadow:0 1px 4px rgba(22,40,59,.15);}
.guide.target{fill:#F6C945;opacity:1;stroke:var(--ink);stroke-width:2.6;stroke-dasharray:none;}
.rev-solid{fill:#97C06E;stroke:#5F8F40;stroke-width:0.8;stroke-linejoin:round;}
.mtoggle{position:absolute;top:8px;right:8px;display:none;background:rgba(255,255,255,.92);
border-radius:9px;padding:2px;z-index:7;box-shadow:0 1px 4px rgba(22,40,59,.15);}
.mtoggle.show{display:flex;}
.mtoggle button{appearance:none;border:none;background:transparent;font-family:inherit;font-weight:800;
font-size:11px;color:var(--ink-soft);padding:5px 11px;border-radius:7px;cursor:pointer;}
.mtoggle button.on{background:var(--ink);color:#fff;}
.overlay{position:absolute;inset:0;pointer-events:none;}
.chip{position:absolute;transform:translate(-50%,-50%);background:var(--land);
border:1.5px solid var(--land-br);border-radius:8px;color:var(--ink);font-weight:700;
font-size:12.5px;line-height:1;padding:6px 9px;white-space:nowrap;pointer-events:auto;cursor:grab;
box-shadow:0 1px 3px rgba(22,40,59,.25);z-index:5;touch-action:none;}
.chip.dragging{cursor:grabbing;box-shadow:0 10px 26px rgba(22,40,59,.4);z-index:999;
transform:translate(-50%,-50%) scale(1.14);}
.chip.locked{pointer-events:none;}
.chip.settle{animation:settle .3s ease;}
@keyframes settle{0%{transform:translate(-50%,-50%) scale(1.22);}
55%{transform:translate(-50%,-50%) scale(.93);}100%{transform:translate(-50%,-50%) scale(1);}}
.legend{position:absolute;left:10px;bottom:10px;display:none;gap:12px;font-size:11px;font-weight:700;
background:rgba(255,255,255,.85);border-radius:8px;padding:5px 9px;}
.legend.show{display:flex;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
.tray-head{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px;}
.tray-head b{font-weight:900;font-size:14px;}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;background:#fff;
border:1.5px dashed var(--line);border-radius:12px;padding:8px;max-height:132px;overflow-y:auto;}
.tray .chip{position:static;transform:none;}
.tray .chip.dragging{position:fixed;transform:translate(-50%,-50%) scale(1.1);}
.btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:900;
border-radius:12px;padding:13px 20px;font-size:16px;transition:transform .08s,filter .15s;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--ink);color:#fff;width:100%;margin-top:14px;}
.btn-primary:hover{filter:brightness(1.12);}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);}
.btn-stamp{background:var(--stamp);color:#fff;}
.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn-row .btn{flex:1;font-size:14px;padding:12px;}
.screen{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;flex-direction:column;
align-items:center;justify-content:center;text-align:center;padding:28px;gap:4px;}
.screen .eyebrow{font-weight:700;color:var(--ink-soft);letter-spacing:.18em;font-size:11px;}
.screen h2{font-weight:900;font-size:clamp(26px,8vw,40px);margin:6px 0;line-height:1.15;}
.screen .lead{color:var(--ink-soft);font-weight:700;max-width:340px;line-height:1.85;margin:4px 0;font-size:14px;}
.rules{text-align:left;background:#fff;border-radius:14px;padding:14px 18px;margin:14px 0;max-width:340px;
font-size:13.5px;line-height:2;color:var(--ink);}
.rules b{color:var(--stamp);}
.screen .btn-primary{max-width:340px;}
.result{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
padding:20px 14px 40px;overflow-y:auto;background:rgba(22,40,59,.3);}
.result.show{display:flex;}
.card{background:#fff;border:2px solid var(--ink);border-radius:18px;width:100%;max-width:420px;
padding:22px;position:relative;box-shadow:0 24px 60px rgba(22,40,59,.4);}
.card .kicker{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.14em;}
.stamp{position:absolute;top:14px;right:14px;font-family:"Shippori Mincho",serif;font-weight:800;
color:var(--stamp);border:3px double var(--stamp);border-radius:8px;padding:4px 9px;font-size:12px;
transform:rotate(-9deg);opacity:.92;line-height:1.3;text-align:center;}
.score-wrap{display:flex;align-items:flex-end;gap:14px;margin:6px 0 2px;}
.score{font-weight:900;font-size:62px;line-height:.9;font-variant-numeric:tabular-nums;}
.score small{font-size:22px;font-weight:900;margin-left:2px;}
.score-side{font-size:12px;color:var(--ink-soft);font-weight:700;line-height:1.7;padding-bottom:6px;}
.title-line{font-family:"Shippori Mincho",serif;font-weight:800;font-size:clamp(20px,6.5vw,26px);
margin:12px 0 2px;color:var(--ink);}
.title-line::before{content:"称号 ";font-family:"Zen Kaku Gothic New";font-size:11px;font-weight:700;
color:var(--ink-soft);letter-spacing:.1em;vertical-align:middle;}
.roasts{margin:14px 0 4px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
.roasts li{position:relative;padding:10px 12px 10px 34px;background:#F5F0E4;border-radius:10px;
font-size:13px;line-height:1.6;font-weight:500;}
.roasts li::before{content:"朱";position:absolute;left:9px;top:9px;width:17px;height:17px;
background:var(--stamp);color:#fff;border-radius:4px;font-size:9px;font-weight:900;
display:flex;align-items:center;justify-content:center;}
.copied{text-align:center;color:var(--good);font-weight:700;font-size:12px;height:15px;margin-top:8px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="screen" id="startScreen">
  <div class="eyebrow">MAP OF JAPAN FROM MEMORY</div>
  <h2>日本再構築<br>テスト</h2>
  <p class="lead">点線の空マスに、47都道府県の名前を記憶だけで置いていく。答え合わせで“本物の形”が出ます。</p>
  <div class="rules">
    名前タイルを<b>マスにドラッグ</b>して置く<br>
    どの県かの正解表示は<b>出ません</b><br>
    間違えた県は、形ごと<b>その場所にワープ</b><br>
    ズレたぶんだけ日本が<b>崩壊</b>します
  </div>
  <button class="btn btn-primary" id="startBtn">はじめる（100秒）</button>
</div>

<div class="wrap">
  <header>
    <div><h1>日本再構築テスト</h1><div class="sub">記憶だけで47都道府県を置く</div></div>
    <div class="hud"><span class="left-count" id="leftCount">残り 47</span><span class="timer" id="timer">1:40</span></div>
  </header>
  <div class="field-shell">
    <div class="field" id="field">
      <svg class="mapsvg" id="mapsvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
        <g id="guideLayer"></g><g id="revealLayer"></g>
      </svg>
      <div class="cap" id="cap"></div>
      <div class="overlay" id="overlay"></div>
      <div class="legend" id="legend"><span><i style="background:var(--good)"></i>正解</span><span><i style="background:var(--stamp)"></i>誤答</span></div>
      <div class="mtoggle" id="mtoggle"><button data-m="judge" class="on">正誤</button><button data-m="map">地図</button></div>
    </div>
  </div>
  <div class="tray-head"><b>都道府県</b><span class="left-count">五十音順</span></div>
  <div class="tray" id="tray"></div>
  <button class="btn btn-primary" id="finishBtn">完成！ 判定する</button>
  <button class="btn btn-primary" id="resultBtn" hidden>結果を見る →</button>
  <button class="btn btn-ghost" id="replayBtn" hidden style="width:100%;margin-top:10px">崩れる様子をもう一度</button>
</div>

<div class="result" id="result">
  <div class="card">
    <div class="stamp" id="stamp">判定<br>済</div>
    <div class="kicker">日本再構築テスト・判定結果</div>
    <div class="score-wrap"><div class="score" id="scoreNum">0<small>点</small></div>
      <div class="score-side" id="scoreSide"></div></div>
    <div class="title-line" id="titleLine">—</div>
    <ul class="roasts" id="roasts"></ul>
    <div class="btn-row">
      <button class="btn btn-ghost" id="viewMapBtn">崩壊地図を見る</button>
      <button class="btn btn-stamp" id="copyBtn">結果をコピー</button>
    </div>
    <button class="btn btn-primary" id="againBtn" style="margin-top:10px">もう一回</button>
    <div class="copied" id="copied"></div>
  </div>
</div>

const WEIGHT = {32:2,31:2,9:2,10:2,8:1.6,16:1.8,17:1.8,18:1.8,21:1.5,24:1.5,25:1.5,29:1.5,36:1.8,37:1.8,38:1.8,39:1.8,41:1.5,42:1.5,44:1.5,19:1.4,20:1.4,1:.6,47:.6,13:.6,27:.6};
const w=c=>WEIGHT[c]||1;

let assign={};   // regionCode -> nameCode
let placedAt={}; // nameCode -> regionCode
let autoSet={};  // regionCode -> true (auto-filled)
let chipEl={};
let timeLeft=100, tickId=null, finished=false;

const field=document.getElementById("field");
const overlay=document.getElementById("overlay");
const tray=document.getElementById("tray");
const guideLayer=document.getElementById("guideLayer");
const revealLayer=document.getElementById("revealLayer");
const timerEl=document.getElementById("timer");
const leftCount=document.getElementById("leftCount");

/* build guide map */
function polyStr(flat){let s="";for(let i=0;i<flat.length;i+=2)s+=(i?" ":"")+flat[i]+","+flat[i+1];return s;}
for(const p of PREFS){
  for(const pl of p.polys){
    const el=document.createElementNS("http://www.w3.org/2000/svg","polygon");
    el.setAttribute("points",polyStr(pl));el.setAttribute("class","guide");
    el.setAttribute("data-code",p.code);
    guideLayer.appendChild(el);
  }
}

/* build chips (name tiles), 50-on order */
const order=PREFS.map(p=>+p.code).sort((a,b)=>YOMI[a].localeCompare(YOMI[b],"ja"));
for(const c of order){
  const t=document.createElement("div");
  t.className="chip";t.textContent=byCode[c].ja;t.dataset.code=c;
  chipEl[c]=t;tray.appendChild(t);attachDrag(t);
}

/* point in polygon */
function pip(x,y,flat){let inside=false;const n=flat.length/2;
  for(let i=0,j=n-1;i<n;j=i++){const xi=flat[2*i],yi=flat[2*i+1],xj=flat[2*j],yj=flat[2*j+1];
    if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
function regionAt(vx,vy){
  for(const p of PREFS){const b=p.bbox;
    if(vx<b[0]-2||vx>b[2]+2||vy<b[1]-2||vy>b[3]+2)continue;
    for(const pl of p.polys){if(pip(vx,vy,pl))return +p.code;}}
  // fallback: nearest centroid within 40 units
  let best=null,bd=40*40;
  for(const p of PREFS){const dx=vx-p.cx,dy=vy-p.cy,d=dx*dx+dy*dy;if(d<bd){bd=d;best=+p.code;}}
  return best;
}
function toVB(clientX,clientY){const r=field.getBoundingClientRect();
  return [(clientX-r.left)/r.width*1000,(clientY-r.top)/r.height*1000];}

/* drag */
let dragFR=null;
function setTarget(rc){
  if(setTarget._cur===rc)return;
  if(setTarget._cur!=null)document.querySelectorAll('.guide[data-code="'+setTarget._cur+'"]').forEach(g=>g.classList.remove("target"));
  if(rc!=null)document.querySelectorAll('.guide[data-code="'+rc+'"]').forEach(g=>g.classList.add("target"));
  setTarget._cur=rc;
}
function attachDrag(el){
  let dragging=false,offX=0,offY=0,curTarget=null;
  function moveTo(cx,cy){
    const fr=dragFR;let rc=null;
    if(cx>=fr.left&&cx<=fr.right&&cy>=fr.top&&cy<=fr.bottom){
      const vx=(cx-fr.left)/fr.width*1000, vy=(cy-fr.top)/fr.height*1000;
      rc=regionAt(vx,vy);
    }
    curTarget=rc;setTarget(rc);
    if(rc!=null){ // gentle magnet: lean toward the region centre so it "seats" a bit
      const p=byCode[rc];
      const sx=fr.left+p.cx/1000*fr.width, sy=fr.top+p.cy/1000*fr.height;
      el.style.left=(cx+(sx-cx)*0.35)+"px";el.style.top=(cy+(sy-cy)*0.35)+"px";
    }else{el.style.left=cx+"px";el.style.top=cy+"px";}
  }
  el.addEventListener("pointerdown",e=>{
    if(finished)return;dragging=true;dragFR=field.getBoundingClientRect();curTarget=null;
    const r=el.getBoundingClientRect();offX=e.clientX-(r.left+r.width/2);offY=e.clientY-(r.top+r.height/2);
    el.setPointerCapture(e.pointerId);el.classList.remove("settle");el.classList.add("dragging");
    document.body.appendChild(el);el.style.position="fixed";
    moveTo(e.clientX-offX,e.clientY-offY);
    e.preventDefault();
  });
  el.addEventListener("pointermove",e=>{if(!dragging)return;moveTo(e.clientX-offX,e.clientY-offY);e.preventDefault();});
  const drop=e=>{
    if(!dragging)return;dragging=false;el.classList.remove("dragging");
    try{el.releasePointerCapture(e.pointerId);}catch(_){}
    setTarget(null);
    const nc=+el.dataset.code;
    if(curTarget!=null)assignName(nc,curTarget);else returnToTray(el);
    curTarget=null;updateCount();
  };
  el.addEventListener("pointerup",drop);el.addEventListener("pointercancel",drop);
}
function placeChipAt(el,rc){
  const p=byCode[rc];overlay.appendChild(el);el.style.position="absolute";
  el.style.left=(p.cx/10)+"%";el.style.top=(p.cy/10)+"%";
  el.classList.remove("settle");void el.offsetWidth;el.classList.add("settle"); // snap-in feel
}
function assignName(nc,rc){
  // clear previous occupant of region
  if(assign[rc]&&assign[rc]!==nc){const old=assign[rc];delete placedAt[old];returnToTray(chipEl[old]);}
  // clear previous position of this name
  if(placedAt[nc]!==undefined&&placedAt[nc]!==rc){delete assign[placedAt[nc]];}
  assign[rc]=nc;placedAt[nc]=rc;placeChipAt(chipEl[nc],rc);
}
function returnToTray(el){
  el.style.position="";el.style.left="";el.style.top="";tray.appendChild(el);
  const nc=+el.dataset.code;if(placedAt[nc]!==undefined){delete assign[placedAt[nc]];delete placedAt[nc];}
  // resort tray
  [...tray.children].sort((a,b)=>YOMI[+a.dataset.code].localeCompare(YOMI[+b.dataset.code],"ja"))
    .forEach(c=>tray.appendChild(c));
}
function updateCount(){leftCount.textContent="残り "+(47-Object.keys(placedAt).length);}

/* timer */
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
document.getElementById("startBtn").onclick=()=>{document.getElementById("startScreen").style.display="none";
  tickId=setInterval(()=>{timeLeft--;timerEl.textContent=fmt(timeLeft);
    if(timeLeft<=10)timerEl.classList.add("low");
    if(timeLeft<=0){clearInterval(tickId);doFinish();}},1000);};

/* finish */
document.getElementById("finishBtn").onclick=()=>{
  if(Object.keys(placedAt).length===0)return;doFinish();};
function doFinish(){
  if(finished)return;finished=true;clearInterval(tickId);
  // auto-fill leftovers randomly
  const emptyRegions=PREFS.map(p=>+p.code).filter(c=>!(c in assign));
  const freeNames=PREFS.map(p=>+p.code).filter(c=>!(c in placedAt));
  for(let i=freeNames.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[freeNames[i],freeNames[j]]=[freeNames[j],freeNames[i]];}
  emptyRegions.forEach((rc,i)=>{const nc=freeNames[i];assign[rc]=nc;placedAt[nc]=rc;autoSet[rc]=true;
    placeChipAt(chipEl[nc],rc);chipEl[nc].classList.add("auto");});
  Object.values(chipEl).forEach(c=>c.classList.add("locked"));
  const res=evaluate();window._res=res;
  overlay.style.display="none";               // hide name labels on the result map
  drawReveal();
  document.getElementById("finishBtn").hidden=true;
  document.getElementById("resultBtn").hidden=false;
  document.getElementById("replayBtn").hidden=false;
  const cap=document.getElementById("cap");cap.textContent="あなたが再構築した日本";cap.style.display="block";
  document.getElementById("legend").classList.add("show");
  document.getElementById("mtoggle").classList.add("show");
  setTimeout(animateCollapse,900);            // hold correct map a beat, then collapse
}

/* scoring + roasts */
function evaluate(){
  let ws=0,wc=0,wrong=[];
  for(const p of PREFS){const rc=+p.code,nc=assign[rc];const ok=nc===rc;
    ws+=w(rc);if(ok)wc+=w(rc);else wrong.push(rc);}
  const acc=Math.round(100*wc/ws);
  const roasts=buildRoasts(wrong);
  const title=buildTitle(acc,roasts.tags,wrong);
  return {acc,collapse:100-acc,wrongN:wrong.length,roasts:roasts.lines,title};
}
const PAIR_TEXT={"31,32":"島根と鳥取を丸ごと交換しました。","9,10":"栃木と群馬、そっくり入れ替えました。",
"16,17":"富山と石川が席替えしています。","36,37":"徳島と香川を取り違えました。",
"37,38":"香川と愛媛が入れ替わっています。","38,39":"愛媛と高知を交換しました。",
"24,25":"三重と滋賀を混同しました。","19,20":"山梨と長野が入れ替わっています。",
"41,42":"佐賀と長崎を取り違えました。"};
function pick(a){return a[Math.random()*a.length|0];}
function buildRoasts(wrong){
  const lines=[],tags=[];const has=c=>assign[c];
  // avalanche
  const autoN=Object.keys(autoSet).length;
  if(autoN>=4){lines.push(autoN+"県が時間切れで雪崩れ込みました。");tags.push("aval");}
  // swaps
  const swaps=[];
  for(const p of PREFS){const rc=+p.code,nc=assign[rc];
    if(nc!==rc&&assign[nc]===rc&&rc<nc)swaps.push([rc,nc]);}
  for(const [a,b] of swaps.slice(0,2)){
    const key=a+","+b;lines.push(PAIR_TEXT[key]||(byCode[a].ja+"と"+byCode[b].ja+"を入れ替えました。"));tags.push("swap");}
  // okinawa
  if(assign[47]!==47){lines.push("沖縄の位置に"+byCode[assign[47]].ja+"が居座っています。");tags.push("oki");}
  // shikoku
  const skWrong=[36,37,38,39].filter(c=>assign[c]!==c).length;
  if(skWrong>=3){lines.push("四国4県、ほぼ総取っ替えです。");tags.push("shikoku");}
  // worst named callouts (highest weight wrong, not yet covered)
  const covered=new Set(swaps.flat());if(assign[47]!==47)covered.add(47);
  const rest=wrong.filter(c=>!covered.has(c)).sort((a,b)=>w(b)-w(a));
  for(const rc of rest){if(lines.length>=4)break;
    lines.push(byCode[rc].ja+"の位置に"+byCode[assign[rc]].ja+"を置きました。");}
  // praise
  if(lines.length<4){const gem=[32,31,9,10,36,39].find(c=>assign[c]===c);
    if(gem)lines.push(byCode[gem].ja+"をきっちり当てたのは玄人です。");}
  if(lines.length===0)lines.push("大きな崩壊なし。かなりの日本通です。");
  return {lines:lines.slice(0,4),tags};
}
const BANDS=[[95,"日本地図、完全記憶"],[82,"なかなかの日本通"],[68,"うろ覚えマスター"],
[52,"雰囲気で日本を語る人"],[36,"地理エアプ"],[20,"日本、再構築失敗"],[0,"これはもう別の国"]];
function buildTitle(acc,tags,wrong){
  const swapN=tags.filter(t=>t==="swap").length;
  if(swapN>=2)return "入れ替え王";
  if(tags.includes("aval")&&acc<55)return "なだれ込み建国";
  if(tags.includes("shikoku")&&acc<65)return "四国解体新書";
  if(tags.includes("oki")&&acc<60)return "沖縄を見失った人";
  return BANDS.find(b=>acc>=b[0])[1];
}

/* reveal: each prefecture piece starts at its TRUE home (a correct Japan),
   then the ones whose name you misplaced fly to where you put them -> collapse. */
let PIECES=[];
let revealMode="judge";                 // "judge" = green/red, "map" = one solid land
const DUR=1.9;                          // collapse duration (s)
function ease(delay){return "transform "+DUR+"s cubic-bezier(.42,.04,.24,1) "+delay+"s";}
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
function pieceClass(ok){return revealMode==="map"?"rev-solid":(ok?"rev-correct":"rev-wrong");}
function applyMode(){PIECES.forEach(p=>p.g.setAttribute("class",pieceClass(p.ok)));}
function setMode(m){revealMode=m;applyMode();
  document.querySelectorAll("#mtoggle button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));}
function drawReveal(){
  document.querySelectorAll(".guide").forEach(g=>g.style.display="none"); // no dotted lines in the result map
  revealLayer.innerHTML="";PIECES=[];
  const NS="http://www.w3.org/2000/svg";
  // correct pieces first (form a stable core), misplaced ones on top
  const codes=PREFS.map(p=>+p.code).sort((a,b)=>(placedAt[a]===a?0:1)-(placedAt[b]===b?0:1));
  for(const nc of codes){
    const rc=placedAt[nc];                 // slot where this name ended up
    const src=byCode[nc];
    const dx=byCode[rc].cx-src.cx, dy=byCode[rc].cy-src.cy;
    const ok=nc===rc;
    const g=document.createElementNS(NS,"g");
    g.setAttribute("class",pieceClass(ok));
    for(const pl of src.polys){
      const el=document.createElementNS(NS,"polygon");let s="";
      for(let i=0;i<pl.length;i+=2)s+=(i?" ":"")+pl[i]+","+pl[i+1];
      el.setAttribute("points",s);g.appendChild(el);
    }
    g.style.transition=reduceMotion?"none":ease(0);
    g.style.transform="translate(0px,0px)"; // start at home = correct map
    revealLayer.appendChild(g);
    PIECES.push({g,dx,dy,ok});
  }
}
function fly(){ // farther pieces leave slightly later, for a richer break-up
  PIECES.forEach(p=>{const dist=Math.hypot(p.dx,p.dy);const delay=Math.min(.5,dist/1500);
    if(!reduceMotion)p.g.style.transition=ease(delay.toFixed(2));
    p.g.style.transform="translate("+p.dx+"px,"+p.dy+"px)";});
}
function animateCollapse(){
  if(reduceMotion){fly();return;}
  revealLayer.getBoundingClientRect(); // force layout so the transition runs
  requestAnimationFrame(()=>requestAnimationFrame(fly));
}
function replayAnim(){
  PIECES.forEach(p=>{p.g.style.transition="none";p.g.style.transform="translate(0px,0px)";});
  revealLayer.getBoundingClientRect();
  requestAnimationFrame(()=>requestAnimationFrame(fly));
}

/* result UI */
function showResult(res){
  document.getElementById("scoreNum").innerHTML=res.acc+'<small>点</small>';
  document.getElementById("scoreSide").innerHTML="正確度<br>崩壊度 "+res.collapse+"<br>誤答 "+res.wrongN+"県";
  document.getElementById("titleLine").textContent=res.title;
  const ul=document.getElementById("roasts");ul.innerHTML="";
  res.roasts.forEach(r=>{const li=document.createElement("li");li.textContent=r;ul.appendChild(li);});
  document.getElementById("stamp").innerHTML=(res.acc>=80?"合格":res.acc>=50?"再考":"崩壊")+"<br>判定";
  window._share="【日本再構築テスト】\n正確度 "+res.acc+"点（崩壊度 "+res.collapse+"）\n称号："+res.title+"\n"+res.roasts.map(r=>"・"+r).join("\n")+"\n#日本再構築テスト";
  document.getElementById("result").classList.add("show");
}
document.getElementById("viewMapBtn").onclick=()=>{document.getElementById("result").classList.remove("show");setMode("map");document.getElementById("legend").classList.remove("show");};
document.getElementById("resultBtn").onclick=()=>showResult(window._res);
document.getElementById("replayBtn").onclick=replayAnim;
document.querySelectorAll("#mtoggle button").forEach(b=>b.onclick=()=>{
  setMode(b.dataset.m);
  document.getElementById("legend").classList.toggle("show",b.dataset.m==="judge");});
document.getElementById("againBtn").onclick=()=>location.reload();
document.getElementById("copyBtn").onclick=async()=>{
  try{await navigator.clipboard.writeText(window._share);document.getElementById("copied").textContent="コピーしました！Xに貼れます";}
  catch(_){document.getElementById("copied").textContent="コピーできない環境です";}
  setTimeout(()=>document.getElementById("copied").textContent="",2500);};
</script>
